name: verify-research-mvp
on: [push, pull_request]
jobs:
  api-ai-simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt -r ai/requirements.txt
      - run: PYTHONPATH=backend pytest backend/tests simulation/test_dtn.py scripts/test_mobile_config.py -q
      - run: python ai/train.py
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
