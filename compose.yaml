services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rescuelink
      POSTGRES_USER: rescuelink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup.py first}
    volumes:
      - rescue_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rescuelink -d rescuelink"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://rescuelink:${POSTGRES_PASSWORD}@db:5432/rescuelink
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Run setup.py first}
      DRILL_KEY: ${DRILL_KEY:?Run setup.py first}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  dashboard:
    build: ./dashboard
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  rescue_db:
